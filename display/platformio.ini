; Firmware für das Fahrtenbuch-Display (ESP32-2432S028R, "Cheap Yellow Display").
; Drei Varianten, weil es das Board mit verschiedenen Display-Chips gibt:
;   cyd             ein USB-Anschluss (Micro-USB), ILI9341       <- Standard
;   cyd_invertiert  wie cyd, aber Farben erscheinen invertiert
;   cyd2usb         zwei USB-Anschlüsse (Micro-USB und USB-C), meist ST7789
; Beim Start zeigt die Firmware drei Farbfelder (Rot, Grün, Blau). Stimmen die Farben
; nicht mit der Beschriftung überein, die andere Variante flashen.

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Zwei App-Slots (je 1,9 MB) für Updates über die UART vom Pi, siehe README "Update vom Pi"
board_build.partitions = min_spiffs.csv
lib_deps =
  lvgl/lvgl@9.2.2
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DCORE_DEBUG_LEVEL=0
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1

[env:cyd]
build_flags = ${env.build_flags} -DILI9341_2_DRIVER=1 -DFW_VARIANTE=\"cyd\"

[env:cyd_invertiert]
build_flags = ${env.build_flags} -DILI9341_2_DRIVER=1 -DTFT_INVERSION_ON=1 -DFW_VARIANTE=\"cyd_invertiert\"

[env:cyd2usb]
build_flags = ${env.build_flags} -DST7789_DRIVER=1 -DTFT_RGB_ORDER=TFT_BGR -DTFT_INVERSION_OFF=1 -DFW_VARIANTE=\"cyd2usb\"
