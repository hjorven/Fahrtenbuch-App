name: Server

on:
  push:
    branches: [server]
    paths: ["server/pb_migrations/**", "server/pb_hooks/**", "server/test_server.sh", "server/docker-compose.yml", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/pb_migrations/**", "server/pb_hooks/**", "server/test_server.sh", "server/docker-compose.yml", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  pocketbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrationen und Hooks gegen PocketBase prüfen
        run: ./server/test_server.sh
