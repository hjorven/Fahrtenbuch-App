name: backup-probe

on:
  push:
    branches: [server]
    paths: ["server/backup-probe/**", ".github/workflows/backup-probe.yml"]
  pull_request:
    paths: ["server/backup-probe/**", ".github/workflows/backup-probe.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/backup-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile probe.py
      - run: python -m unittest -v test_probe
      - run: bash -n install.sh
